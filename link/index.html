<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>導購連結生成器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07080d;
      --surface: rgba(255,255,255,0.04);
      --surface-hover: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.09);
      --border-active: rgba(139,92,246,0.5);
      --purple: #8b5cf6;
      --purple-dim: rgba(139,92,246,0.15);
      --blue: #3b82f6;
      --green: #10b981;
      --green-dim: rgba(16,185,129,0.12);
      --red: #ef4444;
      --text: #f1f5f9;
      --muted: #64748b;
      --subtle: #94a3b8;
      --radius: 14px;
      --radius-sm: 8px;
      --ease: cubic-bezier(.4,0,.2,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 10% -10%, rgba(139,92,246,.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 90% 110%, rgba(59,130,246,.12) 0%, transparent 50%);
      background-attachment: fixed;
      font-family: 'Outfit','Noto Sans TC',sans-serif;
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 99px; }

    /* ── HEADER ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7,8,13,.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
    }

    .logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--purple), var(--blue));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
      box-shadow: 0 0 18px rgba(139,92,246,.35);
    }

    .brand-title {
      font-size: 1rem;
      font-weight: 700;
      background: linear-gradient(120deg, #fff 40%, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      font-size: 0.7rem;
      color: var(--muted);
      display: none;
    }

    @media (min-width: 480px) { .brand-sub { display: block; } }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--green-dim);
      border: 1px solid rgba(16,185,129,.25);
      color: var(--green);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.3rem 0.7rem;
      border-radius: 99px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--green);
      animation: blink 1.8s ease-in-out infinite;
    }

    @keyframes blink {
      0%,100% { opacity:.5; transform:scale(.8); }
      50% { opacity:1; transform:scale(1.2); box-shadow:0 0 6px var(--green); }
    }

    /* ── MAIN WRAPPER ── */
    .container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }

    /* ── STEP FLOW (mobile: vertical card list) ── */
    .flow {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    @media (min-width: 900px) {
      .flow {
        display: grid;
        grid-template-columns: minmax(0,1.1fr) minmax(0,1.6fr);
        grid-template-rows: auto auto;
        gap: 1.25rem;
        align-items: start;
      }
      .flow .card-config { grid-row: 1 / 2; }
      .flow .card-input  { grid-row: 1 / 2; }
      .flow .card-result { grid-column: 1 / -1; }
      .flow .card-history { grid-column: 1 / -1; }
    }

    /* ── CARD ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      transition: border-color .2s var(--ease);
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--subtle);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 1.25rem;
    }

    .card-title .step-num {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: var(--purple-dim);
      border: 1px solid rgba(139,92,246,.3);
      color: var(--purple);
      font-size: 0.72rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* ── FORM ── */
    .field { margin-bottom: 1.1rem; }
    .field:last-child { margin-bottom: 0; }

    .field-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.45rem;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .field-label .count {
      font-weight: 700;
      color: var(--text);
      font-family: monospace;
      text-transform: none;
      letter-spacing: 0;
    }

    input[type=text], textarea, select {
      width: 100%;
      background: rgba(0,0,0,.3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: inherit;
      font-size: 0.88rem;
      padding: 0.7rem 0.9rem;
      transition: border-color .15s var(--ease), box-shadow .15s var(--ease);
      -webkit-appearance: none;
    }

    input[type=text]:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--border-active);
      box-shadow: 0 0 0 3px rgba(139,92,246,.12);
    }

    textarea {
      resize: vertical;
      min-height: 200px;
      font-family: 'SF Mono','Fira Code',monospace;
      font-size: 0.82rem;
      line-height: 1.65;
    }

    @media (min-width: 900px) {
      textarea { min-height: 280px; }
    }

    /* ── BRAND SEARCH ── */
    .brand-search-wrap { position: relative; margin-bottom: 0.6rem; }

    .brand-search-wrap input {
      padding-left: 2.2rem;
    }

    .search-icon {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 0.85rem;
      pointer-events: none;
    }

    .brand-list {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: rgba(0,0,0,.25);
    }

    .brand-list-inner {
      max-height: 220px;
      overflow-y: auto;
    }

    @media (min-width: 900px) {
      .brand-list-inner { max-height: 260px; }
    }

    .brand-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      padding: 0.6rem 0.85rem;
      cursor: pointer;
      transition: background .12s var(--ease);
      border-bottom: 1px solid var(--border);
    }

    .brand-item:last-child { border-bottom: none; }

    .brand-item:hover { background: var(--surface-hover); }

    .brand-item.active {
      background: rgba(139,92,246,.12);
      border-left: 3px solid var(--purple);
    }

    .brand-name {
      font-size: 0.83rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .brand-item.active .brand-name { color: #fff; font-weight: 600; }

    .offer-pill {
      font-size: 0.68rem;
      font-family: monospace;
      background: rgba(255,255,255,.07);
      color: var(--muted);
      padding: 0.12rem 0.4rem;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .brand-item.active .offer-pill {
      background: var(--purple);
      color: #fff;
    }

    .brand-empty {
      padding: 1.5rem;
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
    }

    /* 選中品牌顯示 */
    .selected-brand-bar {
      display: none;
      align-items: center;
      gap: 0.5rem;
      background: rgba(139,92,246,.1);
      border: 1px solid rgba(139,92,246,.25);
      border-radius: var(--radius-sm);
      padding: 0.55rem 0.8rem;
      margin-top: 0.6rem;
      font-size: 0.82rem;
    }

    .selected-brand-bar.visible { display: flex; }

    .selected-brand-bar .check { color: var(--purple); }
    .selected-brand-name { color: var(--text); font-weight: 600; flex-grow: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .selected-brand-id { color: var(--muted); font-family: monospace; font-size: 0.75rem; flex-shrink: 0; }

    /* ── COLLAPSE ── */
    .collapse-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      padding: 0.5rem 0;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      transition: color .15s;
      user-select: none;
    }

    .collapse-toggle:hover { color: var(--subtle); }

    .collapse-arrow {
      transition: transform .25s var(--ease);
      font-size: 0.65rem;
    }

    .collapse-toggle.open .collapse-arrow { transform: rotate(180deg); }

    .collapse-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height .3s var(--ease);
    }

    .collapse-body.open { max-height: 400px; }

    .subid-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
      padding-top: 0.75rem;
    }

    .subid-grid .field { margin-bottom: 0; }

    /* ── GENERATE BUTTON ── */
    .btn-generate {
      width: 100%;
      padding: 0.85rem 1.5rem;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--purple), var(--blue));
      color: #fff;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: transform .15s var(--ease), box-shadow .15s var(--ease), opacity .15s;
      box-shadow: 0 4px 20px rgba(139,92,246,.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      position: relative;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-generate::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.1), transparent);
      opacity: 0;
      transition: opacity .15s;
    }

    .btn-generate:hover:not(:disabled)::before { opacity: 1; }
    .btn-generate:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(139,92,246,.45); }
    .btn-generate:active:not(:disabled) { transform: translateY(0); }
    .btn-generate:disabled { opacity: .45; cursor: not-allowed; }

    .btn-spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── RESULTS ── */
    .results-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .results-count {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .results-count strong { color: var(--green); }

    .results-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .btn-sm {
      padding: 0.4rem 0.75rem;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s var(--ease), border-color .15s;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    .btn-sm:hover { background: var(--surface-hover); border-color: rgba(255,255,255,.18); }

    .btn-sm.danger { color: #fca5a5; border-color: rgba(239,68,68,.2); }
    .btn-sm.danger:hover { background: rgba(239,68,68,.08); }

    /* ── RESULT CARDS LIST ── */
    .result-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .result-card {
      background: rgba(0,0,0,.2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.85rem 1rem;
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 0.6rem 0.75rem;
      align-items: start;
      transition: border-color .15s;
    }

    .result-card:hover { border-color: rgba(139,92,246,.3); }

    .result-idx {
      font-size: 0.68rem;
      font-family: monospace;
      color: var(--muted);
      background: rgba(255,255,255,.06);
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 0.3rem;
    }

    .result-original {
      font-size: 0.78rem;
      color: var(--muted);
      font-family: monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.3rem;
    }

    .result-deep {
      font-size: 0.82rem;
      color: #a78bfa;
      font-family: monospace;
      word-break: break-all;
      line-height: 1.5;
    }

    .btn-copy-card {
      background: rgba(139,92,246,.12);
      border: 1px solid rgba(139,92,246,.25);
      color: #c084fc;
      font-size: 0.72rem;
      font-family: inherit;
      font-weight: 600;
      padding: 0.3rem 0.6rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      white-space: nowrap;
      transition: background .12s, color .12s;
      -webkit-tap-highlight-color: transparent;
      align-self: start;
    }

    .btn-copy-card:hover { background: var(--purple); color: #fff; }
    .btn-copy-card.copied { background: var(--green-dim); border-color: rgba(16,185,129,.3); color: var(--green); }

    /* ── EMPTY STATE ── */
    .empty-state {
      padding: 3rem 1rem;
      text-align: center;
      color: var(--muted);
    }

    .empty-icon {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 0.6rem;
      opacity: .4;
    }

    .empty-state p { font-size: 0.85rem; }

    /* ── HISTORY ── */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 260px;
      overflow-y: auto;
    }

    .history-card {
      background: rgba(0,0,0,.15);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.65rem 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .history-brand {
      font-size: 0.73rem;
      font-weight: 600;
      background: rgba(59,130,246,.12);
      border: 1px solid rgba(59,130,246,.2);
      color: #93c5fd;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      white-space: nowrap;
    }

    .history-meta {
      font-size: 0.73rem;
      color: var(--muted);
      flex-grow: 1;
      min-width: 0;
    }

    .history-cnt {
      font-size: 0.73rem;
      font-weight: 700;
      color: var(--green);
    }

    .history-btns {
      display: flex;
      gap: 0.35rem;
      flex-shrink: 0;
    }

    .history-btns .btn-sm { font-size: 0.7rem; padding: 0.25rem 0.55rem; }

    /* ── TOAST ── */
    .toast-wrap {
      position: fixed;
      bottom: 1.5rem;
      right: 1.25rem;
      z-index: 9999;
      display: flex;
      flex-direction: column-reverse;
      gap: 0.4rem;
      pointer-events: none;
    }

    .toast {
      background: rgba(15,17,26,.95);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.65rem 1rem;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 28px rgba(0,0,0,.4);
      opacity: 0;
      transform: translateY(12px) scale(.97);
      transition: opacity .22s var(--ease), transform .22s var(--ease);
      max-width: min(340px, calc(100vw - 2.5rem));
    }

    .toast.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    .toast.success { border-left: 3px solid var(--green); }
    .toast.error   { border-left: 3px solid var(--red); }

    /* ── DIVIDER ── */
    .divider { border: none; border-top: 1px solid var(--border); margin: 0; }

  </style>
</head>
<body>

<header class="header">
  <div class="header-brand">
    <div class="logo">🔗</div>
    <div>
      <div class="brand-title">導購連結生成器</div>
      <div class="brand-sub">Affiliates.One Deep Link v2.0</div>
    </div>
  </div>
  <div class="status-badge">
    <div class="status-dot"></div>
    已連線
  </div>
</header>

<div class="container">
  <div class="flow">

    <!-- STEP 1: 設定 -->
    <section class="card card-config">
      <div class="card-title">
        <span class="step-num">1</span>
        選擇品牌 &amp; 設定
      </div>

      <!-- 品牌搜尋 -->
      <div class="field">
        <div class="field-label">選擇品牌電商</div>
        <div class="brand-search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="brand-search" placeholder="搜尋品牌...如 酷澎、Klook">
        </div>
        <div class="brand-list">
          <div class="brand-list-inner" id="brand-list"></div>
        </div>
        <div class="selected-brand-bar" id="selected-bar">
          <span class="check">✓</span>
          <span class="selected-brand-name" id="sel-name">-</span>
          <span class="selected-brand-id" id="sel-id"></span>
        </div>
      </div>

      <hr class="divider" style="margin: 1rem 0;">

      <!-- 進階追蹤參數 -->
      <div class="collapse-toggle" id="adv-toggle">
        <span>進階追蹤參數 (選填)</span>
        <span class="collapse-arrow">▼</span>
      </div>
      <div class="collapse-body" id="adv-body">
        <div class="field" style="padding-top:.75rem;">
          <div class="field-label">主追蹤碼 (aff_uniq_id)</div>
          <input type="text" id="aff-uniq-id" placeholder="例如: mytracking">
        </div>
        <div class="subid-grid">
          <div class="field">
            <div class="field-label">Sub ID 1</div>
            <input type="text" id="sub1" placeholder="fb_post">
          </div>
          <div class="field">
            <div class="field-label">Sub ID 2</div>
            <input type="text" id="sub2" placeholder="article_1">
          </div>
          <div class="field">
            <div class="field-label">Sub ID 3</div>
            <input type="text" id="sub3">
          </div>
          <div class="field">
            <div class="field-label">Sub ID 4</div>
            <input type="text" id="sub4">
          </div>
          <div class="field" style="grid-column:1/-1;">
            <div class="field-label">Sub ID 5</div>
            <input type="text" id="sub5">
          </div>
        </div>
      </div>
    </section>

    <!-- STEP 2: 輸入網址 + 生成 -->
    <section class="card card-input">
      <div class="card-title">
        <span class="step-num">2</span>
        輸入商品網址
      </div>

      <div class="field">
        <div class="field-label">
          目標網址（一行一個，最多 50 組）
          <span class="count" id="url-count">0 / 50</span>
        </div>
        <textarea id="urls-input"
          placeholder="貼上商品原始網址，例如：&#10;https://www.klook.com/zh-TW/activity/12345/&#10;https://www.klook.com/zh-TW/activity/67890/"></textarea>
      </div>

      <button class="btn-generate" id="gen-btn">
        <span class="btn-spinner" id="btn-spinner"></span>
        <span id="btn-label">⚡ 批次生成推廣連結</span>
      </button>
    </section>

    <!-- STEP 3: 結果 -->
    <section class="card card-result" id="result-section">
      <div class="card-title">
        <span class="step-num">3</span>
        生成結果
      </div>

      <div id="results-wrap">
        <div class="empty-state">
          <span class="empty-icon">🔗</span>
          <p>選擇品牌、貼上網址後，點擊生成按鈕。</p>
        </div>
      </div>
    </section>

    <!-- 歷史紀錄 -->
    <section class="card card-history">
      <div class="card-title">
        <span class="step-num" style="background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.25);color:#60a5fa;">H</span>
        本地歷史紀錄
      </div>
      <div class="history-list" id="history-list">
        <div class="empty-state" style="padding:1.5rem;">
          <p>暫無紀錄</p>
        </div>
      </div>
    </section>

  </div>
</div>

<div class="toast-wrap" id="toast-wrap"></div>

<script>
  // ── API Key 硬編碼（不外露於 UI）──
  const API_KEY = 'ce215512ced21900a92d00f2e7a0e9f1';

  const BRANDS = [
    { id:'6434', name:'Coupang 酷澎 臺灣',            cat:'宅配美食, 居家家電, 電子商城' },
    { id:'6660', name:'CapCut',                       cat:'雲端工具, APP 軟體' },
    { id:'6538', name:'Acer Store 臺灣',               cat:'電腦週邊' },
    { id:'2950', name:'AirAsia Travel',               cat:'旅遊度假, 機票住宿' },
    { id:'2154', name:'Yahoo 購物中心 臺灣',            cat:'電子商城' },
    { id:'4505', name:'ANKER 臺灣',                    cat:'3C電子產品' },
    { id:'5968', name:'Agoda 大中華區',                cat:'機票住宿, 旅遊訂房' },
    { id:'1736', name:'Weider 威德 臺灣',              cat:'保健食品｜益生菌' },
    { id:'1365', name:'悠活原力 YohoPower',            cat:'保健食品' },
    { id:'5689', name:'旅天下 臺灣',                   cat:'旅遊度假, 機票住宿' },
    { id:'2684', name:'東南旅遊 臺灣',                 cat:'旅遊度假, 機票住宿' },
    { id:'5376', name:'Lion Travel 雄獅旅遊',          cat:'機票住宿, 旅遊度假' },
    { id:'3423', name:'Marriott Homes & Villas',      cat:'旅遊度假, 住宿' },
    { id:'1610', name:'Lenovo 聯想電腦 臺灣',          cat:'電腦購物網站' },
    { id:'3805', name:'FunNow',                       cat:'即時預訂餐廳, 住宿, 門票' },
    { id:'2653', name:'funcare 船井生醫',              cat:'保健食品, 美容保養' },
    { id:'1727', name:'Travelocity 旅遊網',           cat:'旅遊度假, 機票住宿' },
    { id:'2906', name:'Hahow 好學校',                  cat:'線上課程平台' },
    { id:'1082', name:'GoDaddy 域名註冊',             cat:'雲端工具, 網域' },
    { id:'2226', name:'Trip.com',                     cat:'機票住宿, 旅遊度假' },
    { id:'2366', name:'Rakuten 樂天旅遊',             cat:'旅遊度假, 機票住宿' },
    { id:'1796', name:'Hotels.com 亞洲',              cat:'旅遊度假, 機票住宿' },
    { id:'2533', name:'AeroBile 翔翼通訊',            cat:'SIM卡, Wi-Fi機' },
    { id:'2525', name:'Uber Eats 臺灣',               cat:'美食外送' },
    { id:'1313', name:'trivago 亞太地區',              cat:'旅遊訂房' },
    { id:'1418', name:'Best Buy 百思買',              cat:'3C家電購物網站' },
    { id:'1481', name:'CheapOAir 便宜機票',           cat:'機票訂購網站' },
    { id:'2148', name:'Agoda 東南亞',                 cat:'機票住宿, 旅遊訂房' },
    { id:'2169', name:'Booking.com 亞太地區',         cat:'機票住宿, 旅遊訂房' },
    { id:'1809', name:'KKday 旅遊體驗',               cat:'自由行, 旅遊周邊, 票券' },
    { id:'2494', name:'IHG 洲際酒店集團',             cat:'預訂假期住宿' },
    { id:'2328', name:'KLOOK 客路',                   cat:'旅遊活動, 門票, 訂房' },
  ];

  let activeId = '';
  let activeName = '';
  let links = [];

  const $ = id => document.getElementById(id);
  const brandList   = $('brand-list');
  const selBar      = $('selected-bar');
  const selName     = $('sel-name');
  const selId       = $('sel-id');
  const urlsInput   = $('urls-input');
  const urlCount    = $('url-count');
  const genBtn      = $('gen-btn');
  const btnSpinner  = $('btn-spinner');
  const btnLabel    = $('btn-label');
  const resultsWrap = $('results-wrap');
  const historyList = $('history-list');

  /* ── RENDER BRANDS ── */
  function renderBrands(list) {
    if (!list.length) {
      brandList.innerHTML = '<div class="brand-empty">找不到符合的品牌</div>';
      return;
    }
    brandList.innerHTML = '';
    list.forEach(b => {
      const el = document.createElement('div');
      el.className = 'brand-item' + (b.id === activeId ? ' active' : '');
      el.innerHTML = `<span class="brand-name">${b.name}</span><span class="offer-pill">${b.id}</span>`;
      el.addEventListener('click', () => selectBrand(b));
      brandList.appendChild(el);
    });
  }

  function selectBrand(b) {
    activeId   = b.id;
    activeName = b.name;
    selName.textContent = b.name;
    selId.textContent   = `#${b.id}`;
    selBar.classList.add('visible');
    renderBrands(currentFilter());
    toast(`已選擇：${b.name}`, 'success');
  }

  function currentFilter() {
    const q = $('brand-search').value.toLowerCase().trim();
    return q ? BRANDS.filter(b =>
      b.name.toLowerCase().includes(q) ||
      b.id.includes(q) ||
      b.cat.toLowerCase().includes(q)
    ) : BRANDS;
  }

  $('brand-search').addEventListener('input', () => renderBrands(currentFilter()));

  /* ── COLLAPSE ── */
  const advToggle = $('adv-toggle');
  const advBody   = $('adv-body');
  advToggle.addEventListener('click', () => {
    const open = advBody.classList.toggle('open');
    advToggle.classList.toggle('open', open);
  });

  /* ── URL COUNT ── */
  function getUrls() {
    return urlsInput.value.split('\n').map(u => u.trim()).filter(u => u.startsWith('http'));
  }

  urlsInput.addEventListener('input', () => {
    const n = getUrls().length;
    urlCount.textContent = `${n} / 50`;
    urlCount.style.color = n > 50 ? 'var(--red)' : 'var(--text)';
  });

  /* ── GENERATE ── */
  genBtn.addEventListener('click', async () => {
    const urls = getUrls();
    if (!activeId) { toast('請先選擇品牌', 'error'); return; }
    if (!urls.length) { toast('請貼上至少一個商品網址（http 開頭）', 'error'); return; }
    if (urls.length > 50) { toast('最多 50 組，請減少行數', 'error'); return; }

    // params
    const params = {};
    const affId = $('aff-uniq-id').value.trim();
    const s1 = $('sub1').value.trim();
    const s2 = $('sub2').value.trim();
    const s3 = $('sub3').value.trim();
    const s4 = $('sub4').value.trim();
    const s5 = $('sub5').value.trim();

    const data = urls.map(url => {
      const item = { target_url: url };
      if (affId) item.aff_uniq_id = affId;
      if (s1) item.subid_1 = s1;
      if (s2) item.subid_2 = s2;
      if (s3) item.subid_3 = s3;
      if (s4) item.subid_4 = s4;
      if (s5) item.subid_5 = s5;
      return item;
    });

    setLoading(true);

    try {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ api_key: API_KEY, offer_id: activeId, data })
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || json.message || `Error ${res.status}`);
      if (!json.data || !Array.isArray(json.data)) throw new Error('API 回應格式異常');

      links = json.data.map(item => ({
        index: item.index,
        original: urls[item.index] || '',
        deep: item.deeplink_url
      }));

      renderResults();
      saveHistory(activeName, links);
      toast(`成功生成 ${links.length} 筆連結！`, 'success');
      $('result-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (e) {
      toast(e.message || '生成失敗，請確認品牌與網址', 'error');
    } finally {
      setLoading(false);
    }
  });

  function setLoading(on) {
    genBtn.disabled = on;
    btnSpinner.style.display = on ? 'block' : 'none';
    btnLabel.textContent = on ? '處理中...' : '⚡ 批次生成推廣連結';
  }

  /* ── RENDER RESULTS ── */
  function renderResults() {
    if (!links.length) {
      resultsWrap.innerHTML = `<div class="empty-state"><span class="empty-icon">🔗</span><p>選擇品牌、貼上網址後，點擊生成按鈕。</p></div>`;
      return;
    }

    const bar = `
      <div class="results-bar">
        <div class="results-count">共 <strong>${links.length}</strong> 筆推廣連結</div>
        <div class="results-actions">
          <button class="btn-sm" id="copy-md-btn">📋 複製 Markdown</button>
          <button class="btn-sm" id="copy-all-btn">📋 複製所有連結</button>
          <button class="btn-sm danger" id="clear-btn">🗑 清空</button>
        </div>
      </div>
    `;

    const cards = links.map(l => `
      <div class="result-card">
        <div>
          <div class="result-idx">#${l.index + 1}</div>
          <div class="result-original" title="${l.original}">${l.original}</div>
          <div class="result-deep">${l.deep}</div>
        </div>
        <button class="btn-copy-card" onclick="copyOne('${l.deep}', this)">複製</button>
      </div>
    `).join('');

    resultsWrap.innerHTML = bar + `<div class="result-list">${cards}</div>`;

    $('copy-all-btn').onclick = () => {
      copyText(links.map(l => l.deep).join('\n'), '所有連結已複製！');
    };
    $('copy-md-btn').onclick = () => {
      copyText(links.map((l,i) => `[商品 ${i+1}](${l.deep})`).join('\n'), 'Markdown 已複製！');
    };
    $('clear-btn').onclick = () => {
      links = [];
      renderResults();
      toast('已清空結果', 'success');
    };
  }

  window.copyOne = function(url, btn) {
    navigator.clipboard.writeText(url).then(() => {
      btn.textContent = '✓ 已複製';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = '複製'; btn.classList.remove('copied'); }, 2000);
    });
  };

  function copyText(text, msg) {
    navigator.clipboard.writeText(text).then(() => toast(msg, 'success')).catch(() => toast('複製失敗', 'error'));
  }

  /* ── HISTORY ── */
  function saveHistory(brand, ls) {
    try {
      const h = JSON.parse(localStorage.getItem('aff_history') || '[]');
      h.unshift({ ts: Date.now(), brand, count: ls.length, links: ls });
      if (h.length > 12) h.pop();
      localStorage.setItem('aff_history', JSON.stringify(h));
      renderHistory();
    } catch(_) {}
  }

  function renderHistory() {
    try {
      const h = JSON.parse(localStorage.getItem('aff_history') || '[]');
      if (!h.length) {
        historyList.innerHTML = '<div class="empty-state" style="padding:1.5rem;"><p>暫無紀錄</p></div>';
        return;
      }
      historyList.innerHTML = h.map((r, i) => {
        const t = new Date(r.ts).toLocaleString('zh-TW', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12: false });
        return `
          <div class="history-card">
            <span class="history-brand">${r.brand}</span>
            <span class="history-meta">${t}</span>
            <span class="history-cnt">${r.count} 筆</span>
            <div class="history-btns">
              <button class="btn-sm" onclick="loadHistory(${i})">載入</button>
              <button class="btn-sm danger" onclick="delHistory(${i})">刪除</button>
            </div>
          </div>
        `;
      }).join('');
    } catch(_) {}
  }

  window.loadHistory = function(i) {
    try {
      const h = JSON.parse(localStorage.getItem('aff_history') || '[]');
      links = h[i].links;
      renderResults();
      toast(`已載入 ${h[i].brand} 的 ${h[i].count} 筆紀錄`, 'success');
      $('result-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch(_) { toast('載入失敗', 'error'); }
  };

  window.delHistory = function(i) {
    try {
      const h = JSON.parse(localStorage.getItem('aff_history') || '[]');
      h.splice(i, 1);
      localStorage.setItem('aff_history', JSON.stringify(h));
      renderHistory();
    } catch(_) {}
  };

  /* ── TOAST ── */
  function toast(msg, type = 'success') {
    const wrap = $('toast-wrap');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.innerHTML = `<span>${type === 'success' ? '✓' : '✕'}</span> ${msg}`;
    wrap.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => {
      el.classList.remove('show');
      setTimeout(() => el.remove(), 250);
    }, 3000);
  }

  /* ── INIT ── */
  renderBrands(BRANDS);
  renderHistory();
</script>
</body>
</html>
